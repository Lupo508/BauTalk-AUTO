name: Build BauTalk APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Rename APK
        run: |
          mkdir -p OUT
          cp app/build/outputs/apk/debug/app-debug.apk OUT/BauTalk-AUTO-SR-PL-DE.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BauTalk-AUTO-SR-PL-DE
          path: OUT/BauTalk-AUTO-SR-PL-DE.apk
          if-no-files-found: error
